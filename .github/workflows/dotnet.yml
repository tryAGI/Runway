name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/dotnet-sdk-build-test-publish.yml@main
    with:
      dotnet-version: 10.0.x
      project-path: Runway.slnx
      run-tests: false
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        run: dotnet test src/tests/IntegrationTests/Runway.IntegrationTests.csproj --configuration Release --nologo --logger GitHubActions

  trim-check:
    name: Trimming Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Install AutoSDK CLI
        run: dotnet tool install --global autosdk.cli --prerelease

      - name: Run trimming check
        run: autosdk trim src/libs/Runway/Runway.csproj

  cli-smoke:
    name: CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build CLI
        run: dotnet build src/cli/Runway.Cli/Runway.Cli.csproj -c Release

      - name: Smoke dnx package
        run: dotnet dnx Runway.Cli --source "$PWD/src/cli/Runway.Cli/bin/Release" --prerelease --yes models

      - name: Smoke root help
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- --help

      - name: Smoke model inventory
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- models

      - name: Smoke short-video plan
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- short-video "tiny robot finds a glowing garden" --shots 2 --plan-only --planner deterministic

      - name: Smoke short-video edited-plan help
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- short-video run --help

      - name: Smoke product photoshoot plan
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- product-photoshoot create --prompt "transparent speaker" --mode product_shot --plan-only

      - name: Smoke marketplace cards plan
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- marketplace-cards create --prompt "compact travel kettle" --scope main --plan-only

      - name: Smoke ad-video plan
        run: dotnet run --project src/cli/Runway.Cli -c Release --no-build -- ad-video create --prompt "hands-free camera strap" --mode ugc --shots 1 --plan-only

  auto-stable-release:
    name: Automatic stable release report
    needs: [publish, tests, trim-check, cli-smoke]
    if: github.ref == 'refs/heads/main'
    uses: tryAGI/workflows/.github/workflows/auto-stable-release.yml@main
    with:
      project-path: src/libs/Runway/Runway.csproj

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        run: gh release create ${{ github.ref_name }}
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails in seconds when the nuget.org trusted-publishing policy is missing or no longer matches, rather
  # than letting the whole build run and surfacing the mismatch as an HTTP 401 at the push. It declares no
  # `needs`, so it runs beside the build instead of after it, and it has to stay in this workflow for the
  # same reason the push does: nuget.org matches the policy against job_workflow_ref.
  nuget-trusted-publish-check:
    name: Check NuGet trusted publishing
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-trusted-publish-check@main
        with:
          user: havendv

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
          artifact-pattern: nuget-packages-Linux
